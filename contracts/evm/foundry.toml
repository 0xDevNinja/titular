[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
via_ir = false
bytecode_hash = "none"
# foundry >=1.5.1 added a lint rule that flags address(this) in any contract
# that is part of a script's compilation unit, including legitimately deployed
# implementation contracts. Disable lint here; slither covers security checks.
lint = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./test/script" },
]
fuzz = { runs = 256 }
invariant = { runs = 50, depth = 50, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 100, depth = 100, fail_on_revert = false }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
