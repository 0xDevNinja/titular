[workspace]
resolver = "2"
members = [
  "services/runtime-rs",
  "services/planner-rs",
  "services/evaluator-rs",
]
# contracts/solana/programs/* are built with cargo-build-sbf (Solana toolchain)
# and are not included in the root workspace.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
