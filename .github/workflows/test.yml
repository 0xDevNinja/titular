---
name: test

on:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which top-level paths changed in this PR/push so downstream jobs
  # can skip work that doesn't apply. Cheap (~5s) and avoids spinning a
  # 5-minute Postgres container for diffs that never touch the indexer.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      indexer: ${{ steps.filter.outputs.indexer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            indexer:
              - 'services/indexer-go/**'
              - '.github/workflows/test.yml'

  node-test:
    name: node test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.6.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  go-test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [gateway-go, indexer-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test -race ./...
        working-directory: services/${{ matrix.service }}

  # Integration tests for indexer-go (dockertest-driven Postgres apply →
  # down → re-apply). Build-tag-gated so they don't run with the rest of
  # `go test`. Skipped on PRs that don't touch services/indexer-go to keep
  # PR CI fast for unrelated changes. ubuntu-latest already has Docker.
  indexer-integration:
    name: indexer-go integration
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test -tags integration ./internal/db/... -count=1 -timeout 5m
        working-directory: services/indexer-go

  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace

  forge-test:
    name: forge test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts/evm
      - run: forge test -vvv
        working-directory: contracts/evm

  # Stale-bindings gate. Re-runs the abigen script and fails if generated Go
  # bindings drift from the contract artifacts in this commit. Catches PRs
  # that change a Solidity ABI without regenerating internal/abi/*.
  abigen-check:
    name: abigen check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: foundry-rs/foundry-toolchain@v1
      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: regenerate bindings
        working-directory: services/indexer-go
        run: ./scripts/abigen.sh
      - name: fail on diff
        run: |
          if ! git diff --exit-code -- services/indexer-go/internal/abi/; then
            echo "::error::Go bindings under services/indexer-go/internal/abi/ are stale."
            echo "::error::Run services/indexer-go/scripts/abigen.sh and commit the result."
            exit 1
          fi
